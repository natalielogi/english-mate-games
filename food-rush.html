<style>

.conveyor{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative;z-index:1}.foodbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:112px;background:linear-gradient(#1f4b6a,#123049);border:2px solid #50c9f3;border-radius:16px;color:white;transition:transform .15s,background .15s}.foodbtn:hover{transform:translateY(-4px);background:#265c80}.foodbtn .art{font-size:56px;filter:drop-shadow(0 5px 2px #0008)}.foodbtn span:last-child{font-size:12px;font-weight:800;margin-top:5px}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}.option{padding:17px 8px;background:#173e60;color:white;border:2px solid #56c6f1;border-radius:13px;font-size:clamp(15px,2.5vw,21px);font-weight:800;overflow-wrap:anywhere}.option:hover,.word:hover{background:#265b83}.question{font-size:clamp(21px,4vw,32px);font-weight:850;text-align:center;margin:18px auto;max-width:700px}.wordbank{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:15px 0}.word{background:#214e72;color:white;border:2px solid #60d7ed;border-radius:10px;padding:12px;font-weight:800}.word:disabled{opacity:.3}.slots{min-height:70px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;border:2px dashed #5685a0;border-radius:13px;padding:10px}.notice{border-radius:12px;background:#123c56;border:1px solid #50bbdc;padding:12px 16px;margin:12px 0;min-height:45px}.bad{border-color:#ff7272;background:#542c41}.good{border-color:#67e4b0;background:#174e4d}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}.space{justify-content:space-between}.timerlow{color:#ff8585;animation:pulse .65s infinite alternate}@keyframes pulse{to{opacity:.5}}.bigicon{font-size:70px}.hide{display:none!important}
@media(max-width:600px){.missions{grid-template-columns:1fr}.mission{display:flex;gap:12px;align-items:center;text-align:left;padding:10px}.mission .symbol{font-size:32px}.mission b{margin:0}.options{grid-template-columns:1fr}.conveyor{gap:6px}.foodbtn{min-height:95px}.foodbtn .art{font-size:42px}.arena{padding:9px}.hud{font-size:13px}.chip{padding:7px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.decor-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}.robot-decor{position:absolute;right:0;bottom:2%;width:min(22vw,230px);opacity:.55;filter:drop-shadow(0 0 18px #24d9f477)}.blaster-decor{position:absolute;left:-30px;top:14%;width:min(25vw,270px);opacity:.45;transform:rotate(-17deg);filter:drop-shadow(0 0 14px #23c9f455)}main{position:relative;z-index:1}@media(max-width:700px){.robot-decor{width:130px;opacity:.23}.blaster-decor{width:140px;opacity:.2}}.foodbtn .art{display:block;transition:transform .18s}.foodbtn:hover .art{transform:scale(1.15)}
.shooter-arena{background:radial-gradient(circle at 80% 10%,#23608c,#101f3a 65%);box-shadow:inset 0 0 50px #28c8ed25}.shooter-arena:after{content:"TARGET SCANNER // ACTIVE";position:absolute;bottom:0;right:10px;color:#72d9e8;font-size:9px;letter-spacing:2px;opacity:.7}

<script>
"use strict";
const DATA={"foods": [["tomato", "🍅"], ["chicken", "🍗"], ["grapes", "🍇"], ["pasta", "🍝"], ["tuna", "🐟"], ["milk", "🥛"], ["onion", "🧅"], ["lettuce", "🥬"], ["milk shake", "🥤"], ["beef", "🥩"], ["orange", "🍊"], ["egg", "🥚"], ["fruit juice", "🧃"], ["salmon", "🐟"], ["mushroom", "🍄"], ["salt and pepper", "🧂"], ["peas", "🫛"], ["apple", "🍎"], ["water", "💧"], ["rice", "🍚"], ["strawberry", "🍓"], ["potato", "🥔"], ["oil", "🫒"], ["cheese", "🧀"]], "grammar": [["He ___ pizza on Fridays.", ["eat", "eats", "eating"], 1, "С he/she/it в утверждении глагол получает -s."], ["They ___ milk every morning.", ["drinks", "drink", "drinking"], 1, "С they используем начальную форму глагола."], ["She ___ like onions.", ["don't", "doesn't", "isn't"], 1, "С she в отрицании нужен doesn't + глагол."], ["___ you eat breakfast every day?", ["Do", "Does", "Are"], 0, "С you вопрос начинается с Do."], ["___ he like apples?", ["Do", "Does", "Is"], 1, "С he вопрос начинается с Does."], ["My brother ___ lunch at school.", ["have", "has", "having"], 1, "У have с he/she/it особая форма has."], ["We ___ eat fish.", ["doesn't", "don't", "aren't"], 1, "С we в отрицании используем don't."], ["Tom ___ breakfast at 8.", ["have", "has", "haves"], 1, "Tom = he, поэтому has."], ["My friends ___ vegetables.", ["likes", "like", "liking"], 1, "Friends = they, поэтому like."], ["___ she drink lemonade?", ["Do", "Does", "Is"], 1, "С she вопрос начинается с Does."], ["I ___ soup on Mondays.", ["eats", "eat", "eating"], 1, "С I используется eat без -s."], ["He doesn't ___ coffee.", ["drinks", "drink", "drinking"], 1, "После doesn't глагол без -s."], ["My dad ___ pasta on Sundays.", ["cook", "cooks", "cooking"], 1, "С my dad (= he) добавляем -s: cooks."], ["We ___ vegetables every day.", ["eat", "eats", "eating"], 0, "С we глагол без -s: eat."], ["Anna ___ orange juice.", ["drink", "drinks", "drinking"], 1, "Anna = she, поэтому drinks."], ["___ your friends like mushrooms?", ["Do", "Does", "Are"], 0, "Friends = they, поэтому Do."], ["My mum doesn't ___ beef.", ["eats", "eat", "eating"], 1, "После doesn't глагол без -s."], ["I ___ like onions.", ["doesn't", "don't", "am not"], 1, "С I используем don't."], ["___ Tom have lunch at school?", ["Do", "Does", "Is"], 1, "Tom = he, поэтому Does."], ["She ___ breakfast at seven.", ["has", "have", "having"], 0, "She has — особая форма have."], ["They don't ___ tuna.", ["likes", "like", "liking"], 1, "После don't используем начальную форму."], ["My sister ___ salad for lunch.", ["makes", "make", "making"], 0, "С she добавляем -s: makes."], ["___ you drink water at school?", ["Does", "Do", "Are"], 1, "С you вопрос начинается с Do."], ["He ___ eat rice for breakfast.", ["doesn't", "don't", "isn't"], 0, "С he отрицание строится с doesn't."], ["Our teacher ___ coffee.", ["drink", "drinks", "drinking"], 1, "Teacher = he/she, поэтому drinks."], ["The boys ___ sandwiches.", ["likes", "like", "liking"], 1, "Boys = they, поэтому like."], ["___ your brother eat eggs?", ["Does", "Do", "Is"], 0, "Brother = he, поэтому Does."], ["My friends ___ breakfast at home.", ["have", "has", "having"], 0, "Friends = they, поэтому have."], ["Emma ___ eat meat.", ["don't", "doesn't", "isn't"], 1, "Emma = she, поэтому doesn't."], ["I ___ an apple after school.", ["eats", "eat", "eating"], 1, "С I глагол без -s."], ["Dad ___ dinner at six.", ["make", "makes", "making"], 1, "Dad = he, поэтому makes."], ["___ they like peas?", ["Do", "Does", "Are"], 0, "С they используем Do."]], "frequency": [["От «всегда» до «никогда»", ["always", "usually", "often", "sometimes", "rarely", "never"], "Наречия идут от 100% до 0%."], ["She ___ eats breakfast at home.", ["usually", "is usually", "usually is"], 0, "Наречие ставим перед смысловым глаголом eats."], ["He is ___ hungry after football.", ["always", "always is", "is always"], 0, "После формы be ставим наречие: is always."], ["I ___ drink lemonade. (никогда)", ["never", "always", "often"], 0, "Never означает «никогда»."], ["They ___ eat pizza. (иногда)", ["rarely", "sometimes", "always"], 1, "Sometimes означает «иногда»."], ["My sister ___ eats fish. (редко)", ["usually", "rarely", "never"], 1, "Rarely означает «редко»."], ["We are ___ late. (никогда)", ["never", "usually", "often"], 0, "С be наречие ставим после are."], ["He ___ has eggs for breakfast. (часто)", ["often", "never", "rarely"], 0, "Often означает «часто»."], ["She ___ drinks water. (обычно)", ["sometimes", "usually", "never"], 1, "Usually означает «обычно»."], ["I ___ eat rice. (всегда)", ["always", "rarely", "never"], 0, "Always — всегда; перед eat."], ["He ___ drinks milk. (иногда)", ["sometimes", "never", "usually"], 0, "Sometimes — иногда; перед drinks."], ["We ___ have lunch at school. (обычно)", ["rarely", "usually", "never"], 1, "Usually — обычно; перед have."], ["She is ___ happy. (часто)", ["often", "never", "rarely"], 0, "После is ставим often."], ["They are ___ hungry. (иногда)", ["always", "sometimes", "never"], 1, "После are ставим sometimes."], ["I am ___ late. (никогда)", ["never", "often", "usually"], 0, "После am ставим never."], ["Tom ___ eats fish. (редко)", ["rarely", "always", "usually"], 0, "Rarely — редко; перед eats."], ["My parents ___ cook pasta. (часто)", ["never", "often", "rarely"], 1, "Often — часто; перед cook."], ["He ___ has soup. (обычно)", ["usually", "sometimes", "never"], 0, "Usually — обычно; перед has."], ["We are ___ tired. (редко)", ["rarely", "always", "usually"], 0, "После are ставим rarely."], ["She ___ drinks lemonade. (никогда)", ["never", "often", "always"], 0, "Never — никогда; перед drinks."], ["They ___ eat vegetables. (всегда)", ["sometimes", "always", "rarely"], 1, "Always — всегда; перед eat."], ["My brother is ___ hungry. (обычно)", ["usually", "never", "rarely"], 0, "После is ставим usually."], ["I ___ eat mushrooms. (редко)", ["always", "rarely", "often"], 1, "Rarely — редко; перед eat."], ["Anna ___ has eggs for breakfast. (иногда)", ["sometimes", "always", "never"], 0, "Sometimes — иногда; перед has."], ["We ___ drink fruit juice. (часто)", ["often", "rarely", "never"], 0, "Often — часто; перед drink."], ["Dad is ___ at home on Sundays. (всегда)", ["never", "sometimes", "always"], 2, "После is ставим always."], ["They are ___ late for school. (никогда)", ["never", "often", "usually"], 0, "После are ставим never."], ["My friends ___ eat pizza. (иногда)", ["usually", "sometimes", "always"], 1, "Sometimes — иногда; перед eat."], ["I am ___ hungry after football. (часто)", ["rarely", "often", "never"], 1, "После am ставим often."]]};
const app=document.getElementById('app');
const missionNames=['FOOD GRAB','GRAMMAR HACK','FREQUENCY REACTOR'];
const missionIcons=['🍔','⌨️','⚡'];
let state=null,timer=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stop(){if(timer!==null){clearInterval(timer);timer=null}}
function base(){return `<header><div class="tag">ENGLISH, MATE! · ARCADE</div><div class="hud"><div class="chip" id="lives">❤️❤️❤️</div><div class="chip" id="time">⏱ 60s</div><div class="chip" id="score">⭐ 0</div></div></header>`}
function menu(){stop();state=null;app.innerHTML=`${base()}<div class="center"><h1>FOOD RUSH</h1><h2>GRAMMAR ARENA</h2><p class="muted">Почини космическую станцию еды. Пройди три миссии подряд!</p></div><div class="missions">${missionNames.map((n,i)=>`<div class="mission"><div class="symbol">${missionIcons[i]}</div><div><b>MISSION ${i+1}</b>${n}</div></div>`).join('')}</div><div class="panel"><b>ПРАВИЛА ВЫЖИВАНИЯ</b><p>❤️ 3 жизни на всю игру. ⏱ 60 секунд на каждую миссию. Ошибка = минус одна жизнь. Если жизни или время закончатся — начинай с первой миссии. Правильные ответы дают очки и комбо!</p><p class="muted">Управление: нажимай на продукты и варианты ответов. В реакторе собирай слова в нужном порядке.</p></div><div class="center"><button class="primary" id="start">▶ START GAME</button></div>`;document.getElementById('start').onclick=start}
function start(){stop();state={mission:0,idx:0,lives:3,seconds:60,score:0,combo:0,lock:false,notice:'',foods:shuffle(DATA.foods),grammar:shuffle(DATA.grammar).slice(0,6).map(mixChoices),frequency:shuffle(DATA.frequency.slice(1)).slice(0,5).map(mixChoices),picked:[],frequencyWords:shuffle(DATA.frequency[0][1]),correctCount:0};enterMission()}
function mixChoices(q){const opts=q[1].map((value,i)=>({value,correct:i===q[2]}));const mixed=shuffle(opts);return [q[0],mixed.map(x=>x.value),mixed.findIndex(x=>x.correct),q[3]]}
function questions(){return state.mission===0?state.foods.slice(0,6):state.mission===1?state.grammar:[DATA.frequency[0],...state.frequency]}
function enterMission(){stop();state.idx=0;state.seconds=60;state.notice='';state.lock=false;state.picked=[];render();timer=setInterval(()=>{if(!state)return;state.seconds--;updateHud();if(state.seconds<=0)finish(false,'Время вышло!')},1000)}
function updateHud(){const l=document.getElementById('lives'),t=document.getElementById('time'),s=document.getElementById('score');if(!l||!state)return;l.textContent='❤️'.repeat(state.lives)+'🖤'.repeat(3-state.lives);t.textContent='⏱ '+state.seconds+'s';t.classList.toggle('timerlow',state.seconds<=10);s.textContent='⭐ '+state.score+' · COMBO x'+state.combo}
function render(){if(!state)return;const q=questions()[state.idx];const m=state.mission;let body='';
if(m===0){const target=q[0], pool=shuffle([q,...shuffle(DATA.foods.filter(x=>x[0]!==target)).slice(0,5)]);body=`<div class="question">COLLECT: <span style="color:#ffb247">${safe(target)}</span></div><div class="arena shooter-arena"><div class="conveyor">${pool.map(x=>`<button class="foodbtn" data-food="${safe(x[0])}" aria-label="${safe(x[0])}"><span class="art">${x[1]}</span><span>SELECT</span></button>`).join('')}</div></div><p class="muted center">Найди нужный продукт на конвейере. Нажми на его картинку!</p>`}
else if(m===1){body=`<div class="arena"><div class="question">${safe(q[0])}</div><div class="options">${q[1].map((o,i)=>`<button class="option" data-choice="${i}">${safe(o)}</button>`).join('')}</div></div><p class="muted center">Выбери правильную форму Present Simple.</p>`}
else if(state.idx===0){body=`<div class="question">Расположи наречия от 100% до 0%</div><div class="slots" id="slots">${state.picked.length?state.picked.map(w=>`<button class="word" data-remove="${safe(w)}">${safe(w)} ✕</button>`).join(''):'100% → 0%'}</div><div class="wordbank">${state.frequencyWords.map(w=>`<button class="word" data-word="${safe(w)}" ${state.picked.includes(w)?'disabled':''}>${safe(w)}</button>`).join('')}</div><div class="center"><button class="primary" id="check" ${state.picked.length!==6?'disabled':''}>CHECK</button></div><p class="muted center">Нажимай на слова по порядку. Чтобы убрать слово, нажми на него сверху.</p>`}
else{body=`<div class="arena"><div class="question">${safe(q[0])}</div><div class="options">${q[1].map((o,i)=>`<button class="option" data-choice="${i}">${safe(o)}</button>`).join('')}</div></div><p class="muted center">Выбери подходящее наречие или порядок слов.</p>`}
app.innerHTML=`${base()}<div class="row space"><div><div class="tag">MISSION ${m+1} / 3</div><h2>${missionIcons[m]} ${missionNames[m]}</h2></div><div class="chip">TASK ${state.idx+1} / ${questions().length}</div></div><div class="progress"><div style="width:${state.idx/questions().length*100}%"></div></div>${body}<div class="notice ${state.notice?'bad':''}" id="notice" aria-live="polite">${state.notice?safe(state.notice):'⚡ Правильные ответы увеличивают комбо!'}</div><div class="row"><button class="secondary" id="quit">⌂ В меню</button></div>`;
document.getElementById('quit').onclick=menu;updateHud();
app.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>answer(b.dataset.food===q[0],`Нужен ${q[0]}. Ищи подходящую картинку.`));
app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice)===(m===1?q[2]:q[2]),m===1?q[3]:q[3]));
app.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{if(state.lock)return;state.picked.push(b.dataset.word);render()});
app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(state.lock)return;state.picked.splice(state.picked.indexOf(b.dataset.remove),1);render()});
const check=document.getElementById('check');if(check)check.onclick=()=>answer(state.picked.join('|')===q[1].join('|'),q[2]);
}
function answer(ok,hint){if(!state||state.lock)return;state.lock=true;if(ok){state.combo++;state.score+=100+Math.max(0,state.combo-1)*25;state.correctCount++;state.notice='Отлично! +очки за правильный ответ.'}else{state.lives--;state.combo=0;state.notice='Ошибка! '+hint}
updateHud();const note=document.getElementById('notice');if(note){note.textContent=state.notice;note.className='notice '+(ok?'good':'bad')}
app.querySelectorAll('button[data-food],button[data-choice],button[data-word],button[data-remove],#check').forEach(b=>b.disabled=true);
if(state.lives<=0){stop();setTimeout(()=>finish(false,'Все жизни закончились!'),900);return}
setTimeout(()=>{if(!state)return;state.idx++;state.picked=[];state.notice='';state.lock=false;if(state.idx>=questions().length){stop();if(state.mission===2)finish(true,'Станция спасена!');else{state.mission++;missionIntro()}}else render()},850)}
function missionIntro(){stop();const m=state.mission;app.innerHTML=`${base()}<div class="center panel"><div class="bigicon">${missionIcons[m]}</div><h1>MISSION ${m+1}</h1><h2>${missionNames[m]}</h2><p>Отлично! Следующая миссия. Таймер начнётся после нажатия START.</p><button class="primary" id="go">▶ START MISSION</button></div>`;document.getElementById('go').onclick=enterMission;updateHud()}
function finish(win,msg){stop();if(!state)return;const s=state;app.innerHTML=`${base()}<div class="center panel"><div class="bigicon">${win?'🏆':'💥'}</div><h1>${win?'VICTORY!':'GAME OVER'}</h1><h2>${safe(msg)}</h2><p>⭐ Очки: <b>${s.score}</b></p><p>Пройдено заданий: <b>${s.correctCount} / 18</b></p><p>Достигнута миссия: <b>${s.mission+1} / 3</b></p><p class="muted">${win?'Ты справился со всеми тремя миссиями!':'Попробуй ещё раз и побей свой рекорд.'}</p><div class="row"><button class="primary" id="again">↻ PLAY AGAIN</button><button class="secondary" id="home">⌂ MENU</button></div></div>`;document.getElementById('again').onclick=start;document.getElementById('home').onclick=menu;updateHud()}
menu();
</script></body></html>
