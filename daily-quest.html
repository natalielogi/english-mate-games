.catch-wrap{cursor:crosshair;touch-action:none;user-select:none}

.catch-zone{bottom:52px;pointer-events:none}

.clutter.wrong{animation:wrong-wobble .37s ease-in-out}

.room-clean-pop{position:absolute;z-index:4;pointer-events:none;animation:clean-pop .9s ease-out forwards;font-size:clamp(26px,5vw,48px);font-weight:950;color:#8a52c2;text-shadow:0 3px white}

.room-cleared{position:absolute;inset:0;background:#fff9fa63;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,6vw,50px);font-weight:950;color:#7240a4;z-index:4;text-shadow:2px 3px #fff}

.catch-wrap{height:490px;background:linear-gradient(180deg,#eee7ff,#fdfaff 60%,#e5cffa)}

.fall-lane img{width:100%;height:100%;object-fit:contain;object-position:center center;border:3px solid #fff;border-radius:16px;background:linear-gradient(#fff6f7,#f9e8fe);box-shadow:0 4px 12px #6648953a}

.phrase-option:hover:not(:disabled){background:#eadbff;border-color:#8757c5}.phrase-option.selected{background:#d7f8e7;border-color:#60ba82;color:#296c46}
.room-game.waiting .clutter:not(.gone){filter:saturate(.7);opacity:.7;cursor:not-allowed}.room-game.unlocked .clutter:not(.gone){filter:none;opacity:1}
@media(max-width:650px){.catch-wrap{height:390px}.fall-lane{height:205px;padding:2px}.fall-lane img{border-width:2px}.phrase-option{font-size:13px;padding:9px}.phrase-task{padding:9px}}

/* Daily Quest 1.5: smaller falling illustrations, clearer object stickers */

const app=document.getElementById('app');

let session=null,clock=null,token=0,frame=null,advance=null;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stop(){token++;if(clock!==null){clearInterval(clock);clock=null}if(frame!==null){cancelAnimationFrame(frame);frame=null}if(advance!==null){clearTimeout(advance);advance=null}}
function mascot(mood='normal'){return `<div class="mascot ${mood}"><img alt="Козочка English, Mate!" src="${DATA.goat}"></div>`}
const titles=["Who's Doing It?","Action Scanner","Daily Tasks Detective"];
const ing=["sweeping","washing up","doing the shopping","tidying up","cooking","drying the dishes","taking the dog for a walk","feeding the dog"];
function menu(){stop();session=null;app.innerHTML=`<div class="top"><span class="eyebrow">ENGLISH, MATE! · SUPER MINDS 3 · UNIT 3</span><span class="badge">DAILY TASKS</span></div><div class="hero">${mascot()}<div><h1>DAILY QUEST</h1><h2>Mission Home</h2><p class="minor">Выбирай игру и помоги навести порядок!</p></div></div><div class="menu">${titles.map((name,i)=>`<section class="tile"><img src="${DATA.images[[0,1,7][i]]}" alt=""><b>${i+1}. ${name}</b><p>${["Найди на общей картинке того, кто выполняет действие.","Лови картинки козочкой: просто веди мышь по игровому полю, не нажимая кнопки! Скорость можно увеличить.","Сначала выбери английское выражение, затем найди нужный предмет прямо в комнате."][i]}<br>❤️❤️❤️ · три жизни${i===1?' · 60 секунд':''}</p><button class="btn" data-start="${i}">Играть</button></section>`).join('')}</div>`;app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(Number(b.dataset.start)))}
function start(mode){stop();session={mode,lives:3,idx:0,order:shuffle([...DATA.words.keys()]),options:[],seconds:60,locked:false,chosenLane:1,speed:1,fallStart:0,fallOffset:0,goatX:null,completed:new Set(),phraseChosen:false,flightDuration:5500};render();if(mode===1){const k=token;clock=setInterval(()=>{if(!session||token!==k)return;session.seconds--;const el=document.getElementById('timer');if(el)el.textContent='⏱ '+session.seconds+' сек';if(session.seconds<=0)end(false,'Время закончилось!')},1000);startFall()}}
function header(){return `<div class="top"><span class="eyebrow">MISSION ${session.mode+1} / 3</span><div class="hud"><span class="pill" id="hearts">${'❤️'.repeat(session.lives)}${'🤍'.repeat(3-session.lives)}</span>${session.mode===1?`<span class="pill" id="timer">⏱ ${session.seconds} сек</span>`:''}<span class="pill">${session.idx+1} / 8</span></div></div><div class="progress"><div style="width:${session.idx/8*100}%"></div></div>`}
function feedback(text,isBad=false){const f=document.getElementById('feedback');if(f){f.textContent=text;f.className='feedback '+(isBad?'bad':'good')}}
function render(){
if(!session)return;
const q=session.order[session.idx],mode=session.mode;
session.options=shuffle([q,...shuffle([...DATA.words.keys()].filter(i=>i!==q)).slice(0,2)]);
let pictures='',prompt='';
if(mode===0){
 prompt=`Find someone who is ${ing[q]}.`;
 pictures=`<div class="scene" aria-label="Восемь мест с домашними делами">${DATA.images.map((src,i)=>`<button class="scene-tile" data-pick="${i}" aria-label="Персонаж ${i+1}"><img src="${src}" alt=""></button>`).join('')}</div><p class="small">Нажми на персонажа, который выполняет действие.</p>`;
}else if(mode===1){
 prompt=DATA.words[q];
 pictures=`<div class="catch-wrap" id="catchWrap" aria-label="Три падающие картинки, управляй козой указателем мыши">${session.options.map((i,lane)=>`<div class="fall-lane" data-lane="${lane}"><img src="${DATA.images[i]}" alt="Картинка ${lane+1}"></div>`).join('')}<div class="catch-zone"></div><div class="catch-player" id="player"><img src="${DATA.goat}" alt="Коза-ловец"></div></div><div class="catch-options"><span class="small">🐐 Веди мышь внутри поля — коза движется за курсором. Кликать не нужно!</span><button class="speedbtn" id="speed">⚡ Ускорить ×1.5</button></div><p class="catch-guide">На планшете и телефоне можно вести пальцем по полю.</p>`;
}else{
 prompt=DATA.clues[q];
 const objects=[
  {name:'sweep'}, {name:'wash up'}, {name:'do the shopping'}, {name:'tidy up'},
  {name:'cook'}, {name:'dry the dishes'}, {name:'take the dog for a walk'}, {name:'feed the dog'}
 ];
 const pos=[[16,76],[67,42],[84,14],[21,46],[85,39],[62,62],[48,77],[42,64]];
 const clutter=objects.map((object,i)=>{const [x,y]=pos[i];return `<button type="button" class="clutter object-sticker ${session.completed.has(i)?'gone':''}" data-pick="${i}" id="clutter-${i}" aria-label="Игровой предмет ${i+1}" style="left:${x}%;top:${y}%;--angle:${i%2?'-9deg':'8deg'}" ${session.completed.has(i)||!session.phraseChosen?'disabled':''}><img class="object-illustration" src="${OBJECT_ART[i]}" alt="" draggable="false"></button>`}).join('');
 pictures=`<div class="phrase-task"><div class="phrase-label">ШАГ 1 · Выбери подходящее выражение на английском</div><div class="phrase-choices">${session.options.map(i=>`<button type="button" class="phrase-option" data-phrase="${i}" ${session.phraseChosen?'disabled':''}>${DATA.words[i]}</button>`).join('')}</div></div><div class="room-game ${session.phraseChosen?'unlocked':'waiting'}" id="roomGame" aria-label="Интерактивная комната: найди предмет, связанный с выражением">${clutter}<div class="room-status" id="roomStatus">Убрано: ${session.completed.size}/8</div><div class="room-overlay-note" id="roomNote">${session.phraseChosen?'ШАГ 2 · Нажми на нужный предмет в комнате':'Сначала выбери выражение выше ↑'}</div></div><p class="small">При правильном ответе предмет исчезнет с анимацией и комната станет чище. За ошибку снимается одна жизнь.</p>`;
}
app.innerHTML=`${header()}<h2>${titles[mode]}</h2><div class="prompt">${prompt}</div>${pictures}<div class="feedback" id="feedback" aria-live="polite">${mode===1?'Успей поймать верную картинку. Скорость можно менять!':'У тебя три жизни. Найди правильный ответ.'}</div><div class="foot"><button class="btn btn-alt" id="home">← Меню</button><span class="small">English, Mate! 💜</span></div>`;
document.getElementById('home').onclick=menu;

app.querySelectorAll('[data-phrase]').forEach(b=>b.onclick=()=>choosePhrase(Number(b.dataset.phrase)));
if(mode===1){
 const wrap=document.getElementById('catchWrap');
 const follow=(event)=>{
   if(!session||session.locked)return;
   const rect=wrap.getBoundingClientRect();
   const x=Math.min(rect.width,Math.max(0,event.clientX-rect.left));
   session.goatX=x;
   session.chosenLane=Math.min(2,Math.floor(x/rect.width*3));
   const player=document.getElementById('player');
   if(player)player.style.left=`${x}px`;
 };
 wrap.addEventListener('pointermove',follow);
 wrap.addEventListener('pointerdown',event=>{if(event.pointerType!=='mouse'){wrap.setPointerCapture(event.pointerId);follow(event)}});
 const speedButton=document.getElementById('speed');
 speedButton.onclick=()=>{
   if(!session||session.locked)return;
   const now=performance.now();
   if(session.fallStart)session.fallOffset+=(now-session.fallStart)*session.speed;
   session.fallStart=now;session.speed=session.speed===1?1.5:1;
   speedButton.textContent=session.speed===1?'⚡ Ускорить ×1.5':'⚡ Обычная скорость';
   speedButton.classList.toggle('active',session.speed>1);
 };
}

}
function startFall(){
 if(!session||session.mode!==1)return;
 if(frame!==null){cancelAnimationFrame(frame);frame=null}
 const k=token;
 session.fallStart=performance.now();session.fallOffset=0;
 const draw=(now)=>{
  if(!session||token!==k||session.locked)return;
  const progress=Math.min(1,(session.fallOffset+(now-session.fallStart)*session.speed)/session.flightDuration);
  const wrap=document.getElementById('catchWrap');
  if(!wrap)return;
  const available=Math.max(0,wrap.clientHeight-(wrap.querySelector('.fall-lane')?.offsetHeight||165)-65);
  wrap.querySelectorAll('.fall-lane').forEach(el=>{el.style.transform=`translateY(${progress*available}px)`});
  if(progress>=1){frame=null;const choice=session.options[session.chosenLane];answer(choice);return}
  frame=requestAnimationFrame(draw)
 };
 frame=requestAnimationFrame(draw);
}
function choosePhrase(selection){
 if(!session||session.locked||session.mode!==2||session.phraseChosen)return;
 const correct=session.order[session.idx];
 if(selection!==correct){
   session.lives--;
   const hearts=document.getElementById('hearts');if(hearts)hearts.textContent='❤️'.repeat(session.lives)+'🤍'.repeat(3-session.lives);
   feedback('Не то выражение. '+DATA.hints[correct]+' Попробуй ещё раз!',true);
   if(session.lives<=0){session.locked=true;const k=token;advance=setTimeout(()=>{if(token===k&&session)end(false,'Жизни закончились!')},850)}
   return;
 }
 session.phraseChosen=true;
 app.querySelectorAll('[data-phrase]').forEach(b=>{b.disabled=true;if(Number(b.dataset.phrase)===correct)b.classList.add('selected')});
 app.querySelectorAll('.clutter:not(.gone)').forEach(b=>b.disabled=false);
 const room=document.getElementById('roomGame');if(room){room.classList.remove('waiting');room.classList.add('unlocked')}
 const note=document.getElementById('roomNote');if(note)note.textContent='ШАГ 2 · Найди и нажми нужный предмет в комнате';
 feedback('Верно: '+DATA.words[correct]+'! Теперь найди соответствующий предмет в комнате.');
}
function answer(selection){
 if(!session||session.locked)return;
 session.locked=true;
 if(frame!==null){cancelAnimationFrame(frame);frame=null}
 const correct=session.order[session.idx],ok=selection===correct,mode=session.mode;
 if(!ok)session.lives--;
 feedback(ok?'Отлично! Правильное действие! 💜':`Пока не получилось. ${DATA.hints[correct]} Минус одна жизнь.`,!ok);
 const hearts=document.getElementById('hearts');if(hearts)hearts.textContent='❤️'.repeat(session.lives)+'🤍'.repeat(3-session.lives);
 app.querySelectorAll('button[data-pick],#speed').forEach(b=>b.disabled=true);

 if(ok&&mode===2){
   session.completed.add(correct);
   const item=document.getElementById('clutter-'+correct);if(item){item.classList.add('gone');const pop=document.createElement('span');pop.className='room-clean-pop';pop.textContent='✨ CLEAN!';pop.style.left=item.style.left;pop.style.top=item.style.top;item.parentElement.appendChild(pop)}
   const counter=document.getElementById('roomStatus');if(counter)counter.textContent=`Убрано: ${session.completed.size}/8`;
 }
 if(!ok&&mode===2&&session.lives>0){session.locked=false;app.querySelectorAll('.clutter:not(.gone)').forEach(b=>b.disabled=false);return}
 const k=token;
 advance=setTimeout(()=>{
  advance=null;
  if(token!==k||!session)return;
  if(session.lives<=0){end(false,'Жизни закончились!');return}
  session.idx++;session.locked=false;
  if(session.idx>=8){end(true,'Все восемь заданий выполнены!');return}
  session.chosenLane=1;session.phraseChosen=false;render();
  if(mode===1)startFall();
 },mode===2?950:750);
}
function end(win,message){if(!session)return;const mode=session.mode,done=win?8:session.idx,lives=session.lives;stop();session=null;app.innerHTML=`<div class="results">${mascot(win?'happy':'sad')}<span class="eyebrow">${win?'MISSION COMPLETE':'GAME OVER'}</span><h1>${win?'YOU DID IT!':'TRY AGAIN!'}</h1><h2>${message}</h2><p>${win?'Козочка English, Mate! гордится тобой! 💜':'Козочка расстроилась, но верит в твою следующую попытку!'}</p><p class="pill" style="display:inline-block">${win?'🏆 Daily Tasks Champion':'⭐ Попробуй ещё раз'}</p><p class="minor">Заданий: ${done}/8 · Осталось жизней: ${lives}</p><div class="row"><button class="btn" id="again">↻ Играть снова</button><button class="btn btn-alt" id="home">← Все игры</button></div></div>`;document.getElementById('again').onclick=()=>start(mode);document.getElementById('home').onclick=menu}
menu();
</script></body></html>
