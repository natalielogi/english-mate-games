];
const emojiNames={'🥖':'rolls','🥕':'vegetables','🥪':'sandwiches','🍜':'noodles','🍎':'apples','🥚':'eggs','🧀':'cheese','💧':'water','🧃':'apple juice','🍋':'lemonade','🍚':'rice','🧈':'butter','🥣':'soup','🥗':'salad','🍊':'orange juice'};
function customerSticker(i){
const colors=['#f5a5ba','#b3c9ff','#f8c57c','#b8df9a','#c9b7f5','#8cdad2'];
const skin=['#f5bd91','#d99670','#f0c29c','#a86c51','#e3ad82','#c78c65'][i%6];
const shirt=colors[i%6];
const hair=['#6e4035','#342b39','#a75e34','#292d42','#74462f','#3c3534'][i%6];
const accessory=i%3===0?'<path d="M83 55 Q110 15 137 55" stroke="#f27098" stroke-width="10" fill="none"/>':i%3===1?'<rect x="77" y="74" width="28" height="19" rx="8" fill="none" stroke="#40506d" stroke-width="5"/><rect x="115" y="74" width="28" height="19" rx="8" fill="none" stroke="#40506d" stroke-width="5"/><path d="M105 82h10" stroke="#40506d" stroke-width="4"/>':'<path d="M75 56 Q110 22 145 56" fill="none" stroke="#ffcf56" stroke-width="12"/>';
return `<svg class="customer-svg" viewBox="0 0 220 240" role="img" aria-label="Посетитель кафе"><ellipse cx="110" cy="227" rx="80" ry="12" fill="#6c5449" opacity=".18"/><path d="M35 240Q40 151 110 151Q180 151 185 240" fill="${shirt}" stroke="#654b57" stroke-width="5"/><path d="M76 160L110 193L144 160" fill="#fff3e8" stroke="#654b57" stroke-width="4"/><ellipse cx="110" cy="100" rx="65" ry="75" fill="${skin}" stroke="#654b57" stroke-width="5"/><path d="M46 89Q38 17 110 20Q185 20 173 89Q156 61 144 50Q117 82 54 70Z" fill="${hair}"/><path d="M52 80Q33 124 51 147" fill="none" stroke="${hair}" stroke-width="17" stroke-linecap="round"/><path d="M170 78Q188 116 171 145" fill="none" stroke="${hair}" stroke-width="17" stroke-linecap="round"/>${accessory}<ellipse cx="88" cy="103" rx="6" ry="9" fill="#293244"/><ellipse cx="133" cy="103" rx="6" ry="9" fill="#293244"/><path d="M94 134Q110 148 128 133" fill="none" stroke="#9d4d53" stroke-width="5" stroke-linecap="round"/><circle cx="73" cy="122" r="8" fill="#e98988" opacity=".5"/><circle cx="148" cy="122" r="8" fill="#e98988" opacity=".5"/></svg>`;
}
const games={sort:{name:'Food Sort',icon:'🛒',desc:'Countable or uncountable?',items:sortItems},fridge:{name:'Fridge Check',icon:'🧊',desc:'Some, any, is there, are there',items:fridgeItems},chef:{name:"Chef’s Choice",icon:'👩‍🍳',desc:'Shall we…? / How about…?',items:chefItems}};
let activeSortItems=sortItems.slice();const app=document.getElementById('app');let current=null,index=0,tries=0,points=0,answered=false,selected=[],status='',sortedShelves={Countable:[],Uncountable:[]};const records={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function menu(){current=null;app.innerHTML=`<section class="hero"><h1>Food Quest 🍽️</h1><p>Welcome to The Secret Café! Choose a mission and help our café get ready.</p><div class="food">${sticker("sandwiches")}${sticker("salad")}${sticker("apple juice")}${sticker("cake")}</div></section><div class="cards">${Object.entries(games).map(([id,g])=>`<article class="card"><div class="emoji">${g.icon}</div><h3>${esc(g.name)}</h3><p>${esc(g.desc)}</p><button class="btn" data-game="${id}">Play ${records[id]!==undefined?'again':'now'}</button>${records[id]!==undefined?`<span class="small">Last result: ${records[id]}/${g.items.length}</span>`:''}</article>`).join('')}</div><p class="small" style="margin-top:24px">Без таймера! После первой ошибки будет подсказка, после второй — объяснение на русском.</p>`;app.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));}
function start(id){if(id==='sort'){activeSortItems=sortItems.slice();for(let i=activeSortItems.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[activeSortItems[i],activeSortItems[j]]=[activeSortItems[j],activeSortItems[i]];}}current=id;index=0;tries=0;points=0;answered=false;selected=[];status='';lastAnimatedCustomer=-1;sortedShelves={Countable:[],Uncountable:[]};render();}
function getItem(){return current==='sort'?activeSortItems[index]:games[current].items[index]}
let lastAnimatedCustomer=-1;
function render(){if(!current){menu();return}const g=games[current],q=getItem();if(!q){finish();return}const animateCustomer=current==='chef'&&index!==lastAnimatedCustomer;if(current==='chef')lastAnimatedCustomer=index;const isSort=current==='sort',isFridge=current==='fridge',isBuild=current==='chef'&&q.mode==='build';const options=isSort?['Countable','Uncountable']:q.options||[];let question=isSort?`Where does <em>${esc(q.word)}</em> belong?`:esc(q.prompt||q.scene);let visual=isSort?`<div class="shelf-scene"><div class="shelf-grid">${['Countable','Uncountable'].map(type=>`<div><div class="shelf-title">${type}</div><div class="shelf" id="shelf-${type}">${sortedShelves[type].map(word=>sticker(word)).join('')}</div></div>`).join('')}</div><div class="food-stage" id="food-stage">${sticker(q.word)}</div><p class="small" style="text-align:center">Нажми на нужную полку — продукт перелетит туда!</p></div>`:isFridge?`<div class="fridge-scene"><div class="fridge-door"><span class="fridge-door-handle"></span><div class="door-rack">${sticker('water')}${sticker('apple juice')}</div></div><div class="fridge-cabinet"><div class="fridge-light"></div><div class="fridge-interior">${q.visual.map((x,i)=>`<div class="fridge-item">${sticker(emojiNames[x]||'water')}</div>`).join('')}</div><div class="fridge-shelf-line"></div><div class="fridge-drawer">FRESH FOOD</div></div><div class="fridge-note">Посмотри, что есть в холодильнике!</div></div>`:`<div class="cafe-scene"><div class="cafe-window"><div class="cafe-sun"></div></div><div class="cafe-menu-board"><span>THE SECRET CAFÉ</span><small>Fresh food · Happy mood</small></div><div class="cafe-lamp"></div><div class="customer ${animateCustomer?'entering':''}">${customerSticker(index)}</div><div class="customer-speech">${esc(q.scene)}</div><div class="cafe-counter"><div class="counter-top"></div><div class="counter-front"><span>☕ ORDER HERE</span></div><div class="cash-register"><div class="register-screen">£ 0.00</div></div></div></div>`;let input=isBuild?`<p class="small">Tap the words in the correct order. Tap a word above to remove it.</p><p class="small" style="font-size:12px;color:#667085;margin-top:-5px">Нажимай на слова в нужном порядке, чтобы составить предложение. Если ошиблась, нажми на слово в собранной фразе, чтобы убрать его. Затем нажми «Check sentence».</p><div class="sentence" id="sentence">${selected.length?selected.map((w,i)=>`<button class="token" data-remove="${i}" ${answered?'disabled':''}>${esc(w)}</button>`).join(''):'<span class="muted">Build your sentence here…</span>'}</div><div class="tokens">${q.words.map((w,i)=>selected.some(x=>x.i===i)?'':`<button class="token" data-add="${i}" ${answered?'disabled':''}>${esc(w)}</button>`).join('')}</div>`:`<div class="options ${isSort?'shelf-choices':''}">${options.map((o,i)=>`<button class="choice" data-choice="${i}" ${answered?'disabled':''}>${esc(o)}</button>`).join('')}</div>`;
// selected stores {i,w} to distinguish duplicate words
if(isBuild){input=`<p class="small">Tap the words in the correct order. Tap a word above to remove it.</p><p class="small" style="font-size:12px;color:#667085;margin-top:-5px">Нажимай на слова в нужном порядке, чтобы составить предложение. Если ошиблась, нажми на слово в собранной фразе, чтобы убрать его. Затем нажми «Check sentence».</p><div class="sentence">${selected.length?selected.map((x,i)=>`<button class="token" data-remove="${i}" ${answered?'disabled':''}>${esc(x.w)}</button>`).join(''):'<span class="muted">Build your sentence here…</span>'}</div><div class="tokens">${q.words.map((w,i)=>selected.some(x=>x.i===i)?'':`<button class="token" data-add="${i}" ${answered?'disabled':''}>${esc(w)}</button>`).join('')}</div><button class="btn secondary" id="checkBuild" ${answered||selected.length!==q.words.length?'disabled':''}>Check sentence</button>`}
app.innerHTML=`<div class="toolbar"><button class="btn secondary" id="back">← Menu</button><span class="progress">${esc(g.name)} · ${index+1}/${g.items.length}</span></div><div class="bar"><div style="width:${index/g.items.length*100}%"></div></div><section class="panel">${visual}${current==='chef'?'<p class="small" style="font-size:12px;color:#667085;margin:10px 0">Ты работаешь в кафе за кассой. Прочитай просьбу посетителя и выбери подходящий ответ или собери предложение из слов. После первой ошибки появится подсказка — попробуй ещё раз!</p>':''}<div class="question">${question}</div>${input}<div id="feedback" aria-live="polite">${status}</div><div class="actions">${answered?'<button class="btn" id="next">'+(index===g.items.length-1?'See results':'Next →')+'</button>':''}</div></section><p class="small">1 балл за ответ с первой попытки · Вторая попытка — тренировка ·  Без таймера</p>`;
app.querySelector('#back').onclick=menu;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const answer=options[Number(b.dataset.choice)];if(current==='sort'&&answer===getItem().answer){const source=app.querySelector('#food-stage img'),dest=app.querySelector('#shelf-'+answer);if(source&&dest){const a=source.getBoundingClientRect(),d=dest.getBoundingClientRect();const clone=document.createElement('div');clone.className='fly-sticker';clone.style.cssText=`left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px`;clone.innerHTML=source.outerHTML;document.body.appendChild(clone);requestAnimationFrame(()=>{clone.style.transform=`translate(${d.left+d.width/2-a.left-a.width/2}px,${d.top+d.height/2-a.top-a.height/2}px) scale(.45)`;clone.style.opacity='.4'});setTimeout(()=>clone.remove(),750)}}choose(answer)});app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.add);selected.push({i,w:q.words[i]});render()});app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected.splice(Number(b.dataset.remove),1);render()});const check=app.querySelector('#checkBuild');if(check)check.onclick=()=>choose(selected.map(x=>x.w).join(' '));const next=app.querySelector('#next');if(next)next.onclick=()=>{index++;tries=0;answered=false;selected=[];status='';render()};}
function choose(value){if(answered)return;const q=getItem();tries++;if(value===q.answer){if(tries===1)points++;answered=true;if(current==='sort')sortedShelves[value].push(q.word);status=`<div class="feedback good">✅ ${tries===1?'Отлично!':'Теперь правильно!'} ${esc(q.why)}</div>`}else if(tries===1){status=`<div class="feedback">💡 Пока не получилось. ${esc(q.hint||'Можно ли посчитать отдельные предметы? Или это вещество?')} Попробуй ещё раз!</div>`;if(current==='chef'&&q.mode==='build')selected=[];}else{answered=true;if(current==='sort')sortedShelves[q.answer].push(q.word);status=`<div class="feedback bad">📚 Правильный ответ: <strong>${esc(q.answer)}</strong><br>${esc(q.why)}</div>`}render();}
function finish(){const g=games[current],id=current;records[id]=points;app.innerHTML=`<div class="toolbar"><button class="btn secondary" id="back">← Menu</button></div><section class="panel result"><div class="trophy">🏆</div><h1>Миссия выполнена!</h1><h2>${esc(g.name)}</h2><p>Правильно с первой попытки: <strong>${points}/${g.items.length}</strong>.</p><p>Ошибаться не страшно — главное, что ты потренировалась!</p><div class="actions" style="justify-content:center;gap:12px;flex-wrap:wrap"><button class="btn secondary" id="home">Все игры</button><button class="btn" id="again">Играть снова</button></div></section>`;app.querySelector('#back').onclick=menu;app.querySelector('#home').onclick=menu;app.querySelector('#again').onclick=()=>start(id);}
menu();
</script></body></html>
